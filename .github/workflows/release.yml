name: Release

# Publishes NuGet packages to nuget.org when a version tag is pushed. Requires
# the NUGET_API_KEY secret. The docs job requires Pages enabled (source:
# GitHub Actions) before the first tagged release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Same non-root story as ci.yml: keep setup-dotnet inside a user-owned dir.
  DOTNET_INSTALL_DIR: /home/runner/.dotnet

jobs:
  publish:
    name: Pack and publish
    # Same org self-hosted Linux runner as ci.yml. Tags are pushable by
    # writers only, and the fork-PR guard below keeps untrusted PRs off
    # self-hosted infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The tag is externally influenced: validate it before use and bind it
      # under env rather than interpolating into the script.
      - name: Derive package version from tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG_NAME' is not a semantic version tag (vX.Y.Z or vX.Y.Z-suffix)."
            exit 1
          fi
          echo "PACKAGE_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet fsi build.fsx -- -t Restore

      - name: Test
        run: dotnet fsi build.fsx -- -t Test

      - name: Pack
        run: dotnet pack Legate.slnx --configuration Release --output artifacts -p:Version="$PACKAGE_VERSION"

      - name: Publish to nuget.org
        env:
          NUGET_SOURCE: https://api.nuget.org/v3/index.json
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  docs:
    name: Build and deploy docs
    # Deploys the DocFX site to GitHub Pages on version tags. Requires a
    # maintainer to enable Pages on the repository first (source: GitHub
    # Actions); until then this job fails at the deploy step while the
    # build and artifact steps still verify the site.
    # Same org self-hosted Linux runner as ci.yml, with the same fork-PR
    # guard as the publish job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The tag is externally influenced: validate it before use and bind
      # it under env rather than interpolating into the script (same
      # semver check as the publish job).
      - name: Validate version tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG_NAME' is not a semantic version tag (vX.Y.Z or vX.Y.Z-suffix)."
            exit 1
          fi

      - name: Build docs site
        run: dotnet fsi build.fsx -- -t Docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Docs/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
