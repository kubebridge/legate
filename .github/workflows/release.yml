name: Release

# Publishes NuGet packages when a version tag is pushed. Previews go to GitHub
# Packages while the repository is private; switch NUGET_SOURCE and the API key
# to nuget.org for the first public release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The tag is externally influenced: validate it before use and bind it
      # under env rather than interpolating into the script.
      - name: Derive package version from tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG_NAME' is not a semantic version tag (vX.Y.Z or vX.Y.Z-suffix)."
            exit 1
          fi
          echo "PACKAGE_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet fsi build.fsx -- -t Restore

      - name: Test
        run: dotnet fsi build.fsx -- -t Test

      - name: Pack
        run: dotnet pack Legate.slnx --configuration Release --output artifacts -p:Version="$PACKAGE_VERSION"

      - name: Publish to GitHub Packages
        env:
          NUGET_SOURCE: https://nuget.pkg.github.com/kubebridge/index.json
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
