name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # The runner jobs execute as the non-root runner user, which cannot write to
  # /usr/share/dotnet. Point setup-dotnet at a user-owned directory instead;
  # it installs the global.json-pinned SDK there and puts it on PATH.
  DOTNET_INSTALL_DIR: /home/runner/.dotnet

jobs:
  # The single gate for main and pull requests: format, headers, build,
  # test, sample smokes, pack.
  # Every step calls a build.fsx target so the path lists and flags live once.
  # Runs on the org self-hosted Linux runner (default labels self-hosted,
  # linux, x64): GitHub-hosted minutes are billing-blocked, and the runner
  # image already carries the .NET SDKs plus a Docker daemon for Testcontainers.
  # SECURITY: before this repository goes public (#144), re-scope these jobs so
  # untrusted fork PRs never execute on self-hosted infrastructure.
  # Windows leg parked: windows-latest cannot start while billing is broken.
  # Restore the matrix entry when billing is fixed.
  build:
    name: Build and test (linux)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet fsi build.fsx -- -t Restore

      - name: Check formatting
        run: dotnet fsi build.fsx -- -t CheckFormat

      - name: Check SPDX headers
        run: dotnet fsi build.fsx -- -t CheckHeaders

      - name: Build and test
        run: dotnet fsi build.fsx -- -t Test

      - name: Smoke samples
        run: dotnet fsi build.fsx -- -t SmokeSamples

      - name: Pack
        run: dotnet fsi build.fsx -- -t Pack

      - name: Build docs
        run: dotnet fsi build.fsx -- -t Docs

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  # Three-node StaticSeeds harness for the cluster runtime and the wire
  # format (issue 145): Postgres, Redis, and three MinimalHost replicas on
  # legate-cluster, then the .fsx mid-turn-kill smoke. Required for changes
  # under src/Legate/Cluster/** and the wire format; runs on every PR so
  # the gate is the job itself, not a path filter. Self-hosted Linux only:
  # it needs the Docker daemon the runner image already carries.
  # SECURITY: same self-hosted scoping note as build (#144).
  cluster-compose:
    name: Cluster compose harness (linux)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      LEGATE_MINIMALHOST_REPLY_DELAY_MS: "10000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The smoke owns the lifecycle (up --build, quorum wait, mid-turn
      # kill, survivor checks, teardown on success); the reply delay keeps
      # the turn running at kill time. The teardown step is a safety net:
      # the smoke leaves the stack up when it fails for inspection.
      - name: Run crash-resume smoke
        run: dotnet fsi samples/cluster-compose/smoke.crash-resume.fsx

      - name: Tear down harness
        if: always()
        working-directory: samples/cluster-compose
        run: docker compose down -v
