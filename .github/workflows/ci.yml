name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # The runner jobs execute as the non-root runner user, which cannot write to
  # /usr/share/dotnet. Point setup-dotnet at a user-owned directory instead;
  # it installs the global.json-pinned SDK there and puts it on PATH.
  DOTNET_INSTALL_DIR: /home/runner/.dotnet

jobs:
  # The single gate for main and pull requests: format, build, test, sample
  # smokes, pack.
  # Every step calls a build.fsx target so the path lists and flags live once.
  # Runs on the org self-hosted Linux runner (default labels self-hosted,
  # linux, x64): GitHub-hosted minutes are billing-blocked, and the runner
  # image already carries the .NET SDKs plus a Docker daemon for Testcontainers.
  # SECURITY: before this repository goes public (#144), re-scope these jobs so
  # untrusted fork PRs never execute on self-hosted infrastructure.
  # Windows leg parked: windows-latest cannot start while billing is broken.
  # Restore the matrix entry when billing is fixed.
  build:
    name: Build and test (linux)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet fsi build.fsx -- -t Restore

      - name: Check formatting
        run: dotnet fsi build.fsx -- -t CheckFormat

      - name: Build and test
        run: dotnet fsi build.fsx -- -t Test

      - name: Smoke samples
        run: dotnet fsi build.fsx -- -t SmokeSamples

      - name: Pack
        run: dotnet fsi build.fsx -- -t Pack

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  # Every commit in a pull request must carry a Signed-off-by trailer (DCO).
  # Values from the event payload are bound under env and never interpolated
  # into the script body.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer (git commit -s)."
              missing=1
            fi
          done
          exit "$missing"
